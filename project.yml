name: PrismDM
options:
  bundleIdPrefix: com.prismdm
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

packages:
  PrismModules:
    path: Packages/PrismModules

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    OTHER_LDFLAGS:
      - "$(inherited)"
      - "-ObjC"
      - "-lc++"
      - "-lz"
      - "-lbz2"
      - "-liconv"
      - "-lsqlite3"

targets:
  PrismDM:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/AdBlockShards
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: PrismDM
        PRODUCT_BUNDLE_IDENTIFIER: com.prismdm.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Support/PrismDM.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - package: PrismModules
        product: BrowserCore
      - package: PrismModules
        product: MediaInterceptor
      - package: PrismModules
        product: PrismPlayer
      - package: PrismModules
        product: ParallelDownloader
      - package: PrismModules
        product: AdBlockEngine
      - package: PrismModules
        product: VaultManager
      - sdk: VideoToolbox.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: WebKit.framework
      - sdk: LocalAuthentication.framework
      - sdk: MediaPlayer.framework
      - sdk: VisionKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework

schemes:
  PrismDM:
    build:
      targets:
        PrismDM: all
    run:
      config: Debug
    archive:
      config: Release
